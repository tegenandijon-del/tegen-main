<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEGEN Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f5f7;color:#17181a}.wrap{max-width:1200px;margin:auto;padding:20px}.login,.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px #0001}.login{max-width:420px;margin:80px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:18px;background:#fff;border-radius:14px}.num{font-size:28px;font-weight:700}input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:9px}button{padding:10px 14px;border:0;border-radius:9px;background:#17181a;color:#fff;cursor:pointer;margin:3px}.danger{background:#dc2626}.muted{color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.tabs{display:flex;gap:5px;overflow:auto;margin:15px 0}.tabs button{background:#ddd;color:#222;white-space:nowrap}.tabs .on{background:#17181a;color:#fff}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="login" class="login"><h2>🛒 TEGEN Admin</h2><input id="token" placeholder="ADMIN_TOKEN"><button onclick="login()">Kirish</button><p class="muted">Token serverdagi ADMIN_TOKEN bilan bir xil bo'lishi kerak.</p></div><div id="app" style="display:none"><h1>TEGEN Admin</h1><div class="grid"><div class="stat">Mahsulotlar<div id="pc" class="num">0</div></div><div class="stat">Buyurtmalar<div id="oc" class="num">0</div></div><div class="stat">Foydalanuvchilar<div id="uc" class="num">0</div></div><div class="stat">Jami savdo<div id="rev" class="num">0</div></div></div><div class="tabs"><button onclick="tab('products')" class="on">Mahsulotlar</button><button onclick="tab('categories')">Kategoriyalar</button><button onclick="tab('orders')">Buyurtmalar</button><button onclick="tab('proposals')">Tasdiqlash</button><button onclick="tab('workers')">Ishchilar</button></div><div id="content"></div></div></div><script>let token=localStorage.getItem('tegen_admin_token')||'',current='products',cats=[];const A=location.origin;async function api(path,opt={}){let r=await fetch(A+path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+token,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}function login(){token=document.getElementById('token').value.trim();localStorage.setItem('tegen_admin_token',token);show()}async function show(){if(!token)return;try{let s=await api('/admin/stats');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';pc.textContent=s.products;oc.textContent=s.orders;uc.textContent=s.users;rev.textContent=Number(s.revenueAll).toLocaleString()+' so\'m';tab(current)}catch(e){alert('Token yoki server xato')}}async function tab(t){current=t;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',['products','categories','orders','proposals','workers'][i]===t));if(t==='products')return products();if(t==='categories')return categories();if(t==='orders')return orders();if(t==='proposals')return proposals();return workers()}async function products(){let [p,c]=await Promise.all([api('/catalog/products'),api('/catalog/categories')]);cats=c;content.innerHTML='<div class="panel"><h2>Mahsulot qo\'shish</h2><div class="row"><input id="title" placeholder="Nomi"><input id="price" type="number" placeholder="Narxi"></div><div class="row"><input id="old" type="number" placeholder="Eski narx (ixtiyoriy)"><input id="image" placeholder="Rasm URL"></div><select id="cat">'+c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')+'</select><textarea id="desc" placeholder="Tavsif"></textarea><button onclick="addProduct()">➕ Qo\'shish</button></div><div class="panel"><h2>Mahsulotlar</h2><table><tr><th>Nomi</th><th>Narx</th><th>Kategoriya</th><th>Holat</th><th></th></tr>'+p.map(x=>`<tr><td>${esc(x.title)}</td><td>${Number(x.price).toLocaleString()} so'm${x.oldPrice?' / '+Number(x.oldPrice).toLocaleString():''}</td><td>${esc(x.category.name)}</td><td>${x.isActive?'✅':'❌'}</td><td><button onclick="toggleProduct(${x.id},${!x.isActive})">${x.isActive?'O\'chirish':'Yoqish'}</button></td></tr>`).join('')+'</table></div>'}async function addProduct(){await api('/catalog/products',{method:'POST',body:JSON.stringify({title:title.value,price:+price.value,oldPrice:old.value?+old.value:null,image:image.value,description:desc.value,categoryId:+cat.value})});tab('products')}async function toggleProduct(id,isActive){await api('/catalog/products/'+id,{method:'PATCH',body:JSON.stringify({isActive})});tab('products')}async function categories(){let c=await api('/catalog/categories');content.innerHTML='<div class="panel"><h2>Kategoriya</h2><input id="cname" placeholder="Kategoriya nomi"><button onclick="addCat()">Qo\'shish</button><table>'+c.map(x=>`<tr><td>${esc(x.name)}</td><td>${x._count.products} mahsulot</td><td><button class="danger" onclick="delCat(${x.id})">O\'chirish</button></td></tr>`).join('')+'</table></div>'}async function addCat(){await api('/catalog/categories',{method:'POST',body:JSON.stringify({name:cname.value})});tab('categories')}async function delCat(id){await api('/catalog/categories/'+id,{method:'DELETE'});tab('categories')}async function orders(){let o=await api('/orders');content.innerHTML='<div class="panel"><h2>Buyurtmalar</h2><table><tr><th>№</th><th>Mijoz</th><th>Summa</th><th>Status</th><th></th></tr>'+o.map(x=>`<tr><td>#${x.orderNumber}</td><td>${esc(x.user.firstName||'')}</td><td>${Number(x.total).toLocaleString()} so'm</td><td>${x.status}</td><td><select onchange="status(${x.id},this.value)"><option value="NEW">Yangi</option><option value="ACCEPTED">Qabul qilindi</option><option value="PREPARING">Tayyorlanmoqda</option><option value="READY">Tayyor</option><option value="CANCELLED">Bekor qilindi</option></select></td></tr>`).join('')+'</table></div>'}async function status(id,s){await fetch(A+'/orders/'+id+'/status',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:s})});tab('orders')}async function proposals(){let p=await api('/admin/proposals');content.innerHTML='<div class="panel"><h2>Ishchi takliflari</h2><table><tr><th>Ishchi</th><th>Nomi</th><th>Narx</th><th>Tahlil</th><th>Status</th><th></th></tr>'+p.map(x=>`<tr><td>${esc(x.worker.firstName||x.worker.username||'')}</td><td>${esc(x.title)}</td><td>${Number(x.price).toLocaleString()}</td><td>${esc(x.analysis||'-')}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button onclick="review(${x.id},'APPROVED')">✅</button><button class="danger" onclick="review(${x.id},'REJECTED')">❌</button>`:''}</td></tr>`).join('')+'</table></div>'}async function review(id,status){await api('/admin/proposals/'+id,{method:'PATCH',body:JSON.stringify({status})});tab('proposals')}async function workers(){let [w,c]=await Promise.all([api('/admin/workers'),api('/catalog/categories')]);content.innerHTML='<div class="panel"><h2>Ishchi</h2><div class="row"><input id="wtg" placeholder="Telegram ID"><input id="wn" placeholder="Ism"></div><select id="wcat"><option value="">Bo'limsiz</option>'+c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')+'</select><button onclick="addWorker()">Qo\'shish</button><table>'+w.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.telegramId}</td><td>${esc(x.category?.name||'—')}</td><td>${x.isActive?'Faol':'Nofaol'}</td></tr>`).join('')+'</table></div>'}async function addWorker(){await api('/admin/workers',{method:'POST',body:JSON.stringify({telegramId:wtg.value,name:wn.value,categoryId:wcat.value?+wcat.value:undefined})});tab('workers')}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}show()</script></body></html>
